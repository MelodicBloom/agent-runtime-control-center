name: Portfolio Registry Verification

on:
  pull_request:
    paths:
      - memory/portfolio-registry/**
      - scripts/portfolio-registry.mjs
      - scripts/verify-portfolio-registry.mjs
      - tests/portfolio-registry/**
      - docs/portfolio/CONTRACT_PROOF_V0.md
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/portfolio-registry.yml
  push:
    branches:
      - main
    paths:
      - memory/portfolio-registry/**
      - scripts/portfolio-registry.mjs
      - scripts/verify-portfolio-registry.mjs
      - tests/portfolio-registry/**
      - docs/portfolio/CONTRACT_PROOF_V0.md
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/portfolio-registry.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify portfolio registry
        run: node scripts/verify-portfolio-registry.mjs
