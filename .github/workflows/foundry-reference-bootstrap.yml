name: Foundry Reference Bootstrap
on:
  pull_request:
    paths:
      - 'scripts/bootstrap-foundry-studio-agent.sh'
      - 'scripts/foundry-reference-repos.sh'
      - 'scripts/test-foundry-reference-repos.sh'
      - '.github/workflows/foundry-reference-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: bash -n scripts/bootstrap-foundry-studio-agent.sh scripts/foundry-reference-repos.sh scripts/test-foundry-reference-repos.sh
      - name: Verify distinct reference identities
        run: bash scripts/test-foundry-reference-repos.sh
